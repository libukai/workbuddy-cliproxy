name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux plugin
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -o workbuddy.so .
      - name: Build macOS plugin
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -o workbuddy.dylib .
